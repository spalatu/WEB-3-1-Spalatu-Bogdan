<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <title>Lab4</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h2>Lista de cumpărături</h2>
  <input type="text" id="articol" placeholder="Articol">
  <button onclick="adaugaLaStart()">Adaugă la început</button>
  <button onclick="adaugaLaFinal()">Adaugă la final</button>
  <br><br>
  <button onclick="eliminaPrimul()">Șterge primul</button>
  <button onclick="eliminaUltimul()">Șterge ultimul</button>
  <p id="listaCumparaturi"></p>

  <h2>LISTA GRUPEI</h2>
  <p id="totalStudenti"></p>
  <div id="tabelGrupa"></div>

  <h3>Adaugă student</h3>
  Nume complet: <input type="text" id="inputNume"><br><br>
  Ani: <input type="number" id="inputAn"><br><br>
  Media: <input type="number" id="inputMedia"><br><br>
  <button onclick="adaugaStudent()">Adaugă student</button>

  <h3>Exclude student</h3>
  Nume complet: <input type="text" id="inputExclude">
  <button onclick="excludeStudent()">Exclude</button>

  <h3>Caută student</h3>
  Nume complet: <input type="text" id="inputCauta">
  <button onclick="gasesteStudent()">Caută</button>
  <p id="rezultatGasit"></p>

  <script src="script.js"></script>
</body>

</html>
