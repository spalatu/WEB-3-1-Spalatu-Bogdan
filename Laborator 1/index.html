<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fbfaf8;
            color: #0d0d0d;
            font-family: 'Inter', sans-serif;
        }

        main {
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            margin: 0 0 1rem;
        }

        p {
            color: #726f68;
            margin: 0 0 2rem;
        }

        button {
            font-family: inherit;
            font-size: 0.95rem;
            color: #fbfaf8;
            background: #0d0d0d;
            border: none;
            border-radius: 999px;
            padding: 0.85rem 1.8rem;
            cursor: pointer;
        }

        button:hover {
            background: #262626;
        }
    </style>
</head>

<body>
    <main>
        <h1>Hello, world.</h1>
        <p id="status">Click jos ca sa spui "Salut".</p>
        <button id="greet">Salut!</button>
    </main>

    <script>
        let count = 0;
        const status = document.getElementById('status');

        document.getElementById('greet').addEventListener('click', () => {
            count++;
            status.textContent = 'Salut primit — ' + count + (count === 1 ? ' click.' : ' clicks.');
        });
    </script>
</body>

</html>
